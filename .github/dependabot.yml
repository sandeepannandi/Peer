version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        patterns:
          - '@types/*'
          - '*eslint*'
          - '*prettier*'
          - '*typescript*'
          - '*tsx*'
          - '*vitest*'
      minor:
        update-types:
          - minor
      patch:
        update-types:
          - patch
reviewers:
  - sandeepannandi
assignees:
  - sandeepannandi
